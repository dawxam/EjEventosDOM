<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Practica 1</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="imagen">
        <a href="index.html" class="home-btn">&larr; Volver al Home</a>
        <h1>Presiona ALT + F12 (o Ctrl + B) para cambiar la imagen de fondo</h1>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const contenedor = document.getElementById('imagen');

            document.addEventListener('keydown', (event) => {
                const esAltF12 = event.altKey && (event.key === 'F12' || event.code === 'F12');
                const esCtrlB = event.ctrlKey && (event.key === 'b' || event.key === 'B' || event.code === 'KeyB');

                if (esAltF12 || esCtrlB) {
                    event.preventDefault();
                    const randomUrl = `https://picsum.photos/1920/1080?random=${new Date().getTime()}`;
                    contenedor.style.backgroundImage = `url('${randomUrl}')`;
                }
            });
        });
    </script>
</body>
</html>
