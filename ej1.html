<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 1</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">&larr; Volver a Home</a>
        <h1>Ejercicio 1</h1>
        
        <button id="btn-nuevo">Nuevo numero</button>
        <ul id="lista-numeros"></ul>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnNuevo = document.getElementById('btn-nuevo');
            const lista = document.getElementById('lista-numeros');

            btnNuevo.addEventListener('click', () => {
                const numeroAleatorio = Math.floor(Math.random() * 100) + 1;
                const li = document.createElement('li');
                li.textContent = `Numero aleatorio: ${numeroAleatorio}`;
                lista.appendChild(li);
            });
        });
    </script>
</body>
</html>
